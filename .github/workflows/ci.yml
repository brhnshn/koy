name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Windows 11 / .NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Koy.slnx

      - name: Check vulnerable packages
        run: dotnet list Koy.slnx package --vulnerable --include-transitive

      - name: Build (Release, zero warnings)
        run: dotnet build Koy.slnx --no-restore -c Release -warnaserror

      - name: Run xUnit tests
        run: dotnet test Koy.slnx --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 14
