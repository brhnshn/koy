name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore, Build and Test
        run: |
          dotnet restore Koy.slnx
          dotnet build Koy.slnx --no-restore -c Release -warnaserror
          dotnet test Koy.slnx --no-build -c Release

      - name: Publish App (win-x64)
        run: dotnet publish src/App/Koy.App.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Build Velopack Installer & Portable Zip
        shell: pwsh
        run: |
          $rawTag = if ("${{ inputs.tag_name }}" -ne "") { "${{ inputs.tag_name }}" } else { "${{ github.ref_name }}" }
          $ver = $rawTag.TrimStart('v')
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          vpk pack --packId Koy `
                   --packVersion $ver `
                   --packDir publish/win-x64 `
                   --mainExe Koy.exe `
                   --packTitle "Koy" `
                   --packAuthors "Burhan Şahin" `
                   --icon src/App/Resources/app.ico `
                   --runtime win-x64 `
                   --outputDir dist

          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "dist/Koy-win-Portable.zip" -Force

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
          }
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Koy-win-Setup.exe
            dist/Koy-win-Portable.zip
            dist/Koy-*-full.nupkg
            dist/RELEASES
            dist/releases.win.json
            dist/assets.win.json
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
