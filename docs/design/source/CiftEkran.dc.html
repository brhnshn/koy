<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>İki ekranda Koy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 72px 56px; background: #E4E4E7; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; gap: 40px;">

  <div style="display: flex; gap: 40px; align-items: flex-end; justify-content: center;">

    <!-- Ekran 1: ana ekran, Koy çalışıyor -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="width: 620px; height: 349px; border: 10px solid #18181B; border-radius: 12px; background: #1F2A36; position: relative; overflow: hidden;">
        <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 104px; height: 16px; background: #0A0A0B; border-radius: 0 0 9px 9px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; color: #F4F4F5; font-size: 8px; font-weight: 600;">14:36<span style="width: 10px; height: 5px; border: 1px solid #F4F4F5; border-radius: 1px;"></span></div>
        <div style="position: absolute; left: 110px; top: 50px; width: 400px; height: 240px; background: #F4F4F5; border-radius: 6px;"></div>
        <div style="position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); width: 230px; height: 28px; background: rgba(24,24,27,0.92); border-radius: 9px;"></div>
      </div>
      <span style="width: 120px; height: 10px; background: #18181B; border-radius: 0 0 6px 6px;"></span>
      <span style="font-size: 15px; font-weight: 600;">Ekran 1 · ana ekran</span>
      <span style="font-size: 13px; color: #52525B;">Çentik ve dock görünür, hiçbir şey değişmez</span>
    </div>

    <!-- Ekran 2: tam ekran video, Koy yalnız burada gizli -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="width: 620px; height: 349px; border: 10px solid #18181B; border-radius: 12px; background: #000000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(255,255,255,0.12)"></circle><path d="M10 8l6 4-6 4z" fill="#FFFFFF"></path></svg>
        <div style="position: absolute; left: 24px; right: 24px; bottom: 18px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px;"><div style="width: 34%; height: 100%; background: #EF4444; border-radius: 2px;"></div></div>
      </div>
      <span style="width: 120px; height: 10px; background: #18181B; border-radius: 0 0 6px 6px;"></span>
      <span style="font-size: 15px; font-weight: 600;">Ekran 2 · tam ekran video</span>
      <span style="font-size: 13px; color: #52525B;">Yalnız bu ekrandaki çentik ve dock gizlenir</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 600;">{{r.t}}</span>
        <span style="font-size: 13px; color: #52525B; line-height: 1.45;">{{r.b}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rules = [
      { t: 'Her ekranın kendi Koy\'u', b: 'Her monitörde ayrı çentik ve dock; her biri o ekranın DPI\'ına göre ölçeklenir.' },
      { t: 'Tam ekran yalnız kendi ekranında', b: 'Yan ekranda video ya da oyun tam ekrandayken ana ekrandaki Koy kaybolmaz.' },
      { t: 'Ekran tak / çıkar', b: 'Yeni ekran bağlanınca ayara göre çentik ve dock eklenir; çıkarılınca kaldırılır, görev çubuğu bütün ekranlarda gizli kalır.' }
    ];
    return { rules };
  }
}
</script>
</body>
</html>
